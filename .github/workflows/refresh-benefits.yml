name: 혜택 데이터 갱신

# 게릴라성 혜택은 며칠만 열리기도 해서 하루 네 번 돌립니다.
on:
  schedule:
    - cron: "0 21,3,9,15 * * *"   # UTC — 한국시간 06시, 12시, 18시, 24시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 혜택 수집
        run: node tools/collect.mjs
        continue-on-error: true   # 일부 소스가 막혀도 나머지는 반영합니다

      - name: 변경분 커밋
        run: |
          git config user.name "benefit-collector"
          git config user.email "noreply@github.com"
          if git diff --quiet -- data/feed.js data/feed.json; then
            echo "변경 없음"
          else
            git add data/feed.js data/feed.json
            git commit -m "혜택 데이터 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
