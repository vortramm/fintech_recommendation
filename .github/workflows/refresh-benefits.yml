name: 혜택 데이터 갱신

# 게릴라성 혜택은 며칠만 열리기도 해서 하루 네 번 돌립니다.
# 수동 실행(Run workflow)으로 특정 소스만 돌리거나, 받은 JSON 응답을 통째로 받아볼 수 있습니다.
on:
  schedule:
    - cron: "0 21,3,9,15 * * *"   # UTC — 한국시간 06시, 12시, 18시, 24시
  workflow_dispatch:
    inputs:
      only:
        description: "특정 소스만 (id 일부, 예: samsung / payco / link). 비우면 전체"
        required: false
        default: ""
      dump:
        description: "받은 JSON 응답을 통째로 저장해 아티팩트로 올리기"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 서로의 푸시를 밀어냅니다
concurrency:
  group: refresh-benefits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: |
          # npm install 은 lock 파일을 다시 써서 작업트리를 더럽힙니다.
          # 그 미스테이징 변경 때문에 아래 git pull --rebase 가 거부되어 푸시가 계속 실패했습니다.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 수집 로직 자체 점검
        run: node tools/collect.mjs --selftest

      - name: 혜택 수집
        id: collect
        continue-on-error: true   # 일부 소스가 막혀도 나머지는 반영합니다
        run: |
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.dump }}" = "true" ]; then ARGS="$ARGS --dump"; fi
          echo "실행: node tools/collect.mjs $ARGS"
          node tools/collect.mjs $ARGS

      - name: 수집 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benefit-capture
          path: |
            data/feed.json
            tools/captures/
          if-no-files-found: warn
          retention-days: 7

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "benefit-collector"
          git config user.email "noreply@github.com"
          # lock 파일만 되돌립니다. feed 파일은 이번 수집 결과이므로 건드리면 안 됩니다
          git checkout -- package-lock.json 2>/dev/null || true

          if git diff --quiet -- data/feed.js data/feed.json; then
            echo "변경 없음"
            exit 0
          fi

          git add data/feed.js data/feed.json
          git commit -m "혜택 데이터 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"

          # 수집 중에 다른 커밋이 올라왔을 수 있으니 당겨 붙인 뒤 밉니다.
          # --autostash 가 있어야 남은 변경이 있어도 rebase 가 거부되지 않습니다.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if git push; then
              echo "푸시 완료 (시도 $attempt)"
              exit 0
            fi
            echo "푸시 실패, 다시 시도합니다 ($attempt/3)"
            sleep 5
          done
          echo "::error::3번 시도했지만 푸시하지 못했습니다"
          exit 1
